# No application workload or application route is installed.
apiVersion: v1
kind: Namespace
metadata:
  name: ${project}-app
  labels:
    istio.io/rev: ${project}-v1
    istio.io/dataplane-mode: none
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${project}-application
  namespace: ${project}-app
automountServiceAccountToken: false
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: ${project}-strict-mtls
  namespace: ${project}-app
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ${project}-default-deny
  namespace: ${project}-app
spec:
  action: ALLOW
  rules: []
---
# NP-1: all application Pods are isolated in both directions. NP-2 must review
# required traffic before any allow rules or application workloads are added.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${project}-default-deny
  namespace: ${project}-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
