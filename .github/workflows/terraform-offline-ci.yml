          VPC_PASSED: ${{ steps.vpc.outputs.passed }}
          SECRETS_RESULT: ${{ steps.secrets.outcome }}
          SECRETS_PASSED: ${{ steps.secrets.outputs.passed }}
          ACCOUNT_RESULT: ${{ steps.account_policies.outcome }}
          ACCOUNT_PASSED: ${{ steps.account_policies.outputs.passed }}
          TOOLKIT_RESULT: ${{ steps.toolkit.outcome }}
          TOOLKIT_PASSED: ${{ steps.toolkit.outputs.passed }}
          IAM_RESULT: ${{ steps.iam.outcome }}
          IAM_PASSED: ${{ steps.iam.outputs.passed }}
          LOGS_RESULT: ${{ steps.cloudwatch_logs.outcome }}
          LOGS_PASSED: ${{ steps.cloudwatch_logs.outputs.passed }}
          WORKLOAD_RESULT: ${{ steps.lambda_workload.outcome }}
          WORKLOAD_PASSED: ${{ steps.lambda_workload.outputs.passed }}
          ARTIFACT_RESULT: ${{ steps.artifact_bucket.outcome }}
          ARTIFACT_PASSED: ${{ steps.artifact_bucket.outputs.passed }}
          HTTP_API_RESULT: ${{ steps.http_api.outcome }}
          HTTP_API_PASSED: ${{ steps.http_api.outputs.passed }}
          REFERENCE_RESULT: ${{ steps.reference.outcome }}
          SELF_TEST_RESULT: ${{ steps.self_tests.outcome }}
          COMMITTED_VALUES_RESULT: ${{ steps.committed_values.outcome }}
          TFSTATE_RESULT: ${{ steps.tfstate.outcome }}
          TFSTATE_PASSED: ${{ steps.tfstate.outputs.passed }}
          REGISTRY_RESULT: ${{ steps.registry.outcome }}
          REGISTRY_PASSED: ${{ steps.registry.outputs.passed }}
          DEVELOPER_ACCESS_RESULT: ${{ steps.developer_access.outcome }}
          DEVELOPER_ACCESS_PASSED: ${{ steps.developer_access.outputs.passed }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          rows = [
            ("V7-A REST Core", "REST_RESULT", os.environ.get("REST_PASSED", "")),
            ("Terraform installation", "INSTALL_RESULT", ""),
            ("Repository formatting", "FORMAT_RESULT", ""),
            ("Dev root init/validate, readonly lock", "DEV_RESULT", ""),
            ("Dev serverless API root integration/plans/mutations", "ROOT_RESULT", os.environ.get("ROOT_PASSED", "")),
            ("DEV network init/validate/required-inputs/plans/mutations", "NETWORK_RESULT", os.environ.get("NETWORK_PASSED", "")),
            ("DEV platform root/private EKS/required network inputs/security", "PLATFORM_RESULT", os.environ.get("PLATFORM_PASSED", "")),
            ("Cognito actual plans/security", "COGNITO_RESULT", os.environ.get("COGNITO_PASSED", "")),
            ("DEV API root Cognito integration", "API_RESULT", os.environ.get("API_PASSED", "")),
            ("Kubernetes pinned Helm/schema/TLS/RBAC/mutations", "RUNTIME_RESULT", ""),
            ("Kubernetes runtime input builder, offline plan and fake-kubectl status (6c-A, 6c-B1), nothing executed", "RUNTIME_PLAN_RESULT", ""),
            ("Kubernetes DEV certificate script (F4), offline", "CERTIFICATES_RESULT", ""),
            ("Private ECR image mirror script (F18), offline", "IMAGE_MIRROR_RESULT", ""),
            ("Private ingress/TCP/SG/ownership/plans/source mutations", "INGRESS_RESULT", os.environ.get("INGRESS_PASSED", "")),
            ("EKS child/IAM/SG/access/addons/plans/source mutations", "EKS_RESULT", os.environ.get("EKS_PASSED", "")),
            ("VPC init/validate/legacy and routing/endpoint plans/mutations", "VPC_RESULT", os.environ.get("VPC_PASSED", "")),
            ("Secrets Manager init/validate/mock inventory/tests", "SECRETS_RESULT", os.environ.get("SECRETS_PASSED", "")),
            ("Account IAM policy init/validate/inventory/mock tests", "ACCOUNT_RESULT", os.environ.get("ACCOUNT_PASSED", "")),
            ("IAM init/validate/mock tests", "IAM_RESULT", os.environ.get("IAM_PASSED", "")),
            ("CloudWatch Logs init/validate/mock inventory/tests", "LOGS_RESULT", os.environ.get("LOGS_PASSED", "")),
            ("Lambda workload init/validate/four-resource policy matrix/mutations", "WORKLOAD_RESULT", os.environ.get("WORKLOAD_PASSED", "")),
            ("S3 artifact bucket init/validate/configuration/policy/mutations", "ARTIFACT_RESULT", os.environ.get("ARTIFACT_PASSED", "")),
            ("HTTP API init/validate/permission fields/logging/mutations", "HTTP_API_RESULT", os.environ.get("HTTP_API_PASSED", "")),
            ("Official authorization-reference check", "REFERENCE_RESULT", ""),
            ("Checker negative self-tests", "SELF_TEST_RESULT", ""),
            ("DEV State bucket module/bootstrap root plans/mutations", "TFSTATE_RESULT", os.environ.get("TFSTATE_PASSED", "")),
            ("DEV private ECR registry module/root plans/image lock/mutations", "REGISTRY_RESULT", os.environ.get("REGISTRY_PASSED", "")),
            ("Developer access module/root plans/mutations", "DEVELOPER_ACCESS_RESULT", os.environ.get("DEVELOPER_ACCESS_PASSED", "")),
            ("Committed DEV values mock plans/local workflow preflight/backend examples", "COMMITTED_VALUES_RESULT", ""),
            ("Toolkit offline self-tests/export/dry-run", "TOOLKIT_RESULT", os.environ.get("TOOLKIT_PASSED", "")),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("## Offline Terraform validation\n\n| Check | Outcome | Verified test passes |\n| --- | --- | --- |\n")
            for label, result, count in rows:
              summary.write(f"| {label} | {os.environ.get(result) or 'not run'} | {count or '—'} |\n")
            terraform_counts = [count for _label, result, count in rows if result != "TOOLKIT_RESULT" and count]
            if all(os.environ.get(result) == "success" for _label, result, _count in rows):
              summary.write(f"\nTotal verified Terraform mock tests: {sum(map(int, terraform_counts))}.\n")
            summary.write("\nCredential-free mock/static checks only. Live AWS authorization remains unverified.\n")
          PY

      - name: Record final provider and disk usage even after failure
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/provider-storage.py" ]]; then
            python3 "$RUNNER_TEMP/provider-storage.py" job_completion
          else
            echo "Measurement helper unavailable after an earlier failure."
            df -h /
            df -B1 /
            if [[ -d "$RUNNER_TEMP/terraform-plugin-cache" ]]; then
              du -sh "$RUNNER_TEMP/terraform-plugin-cache"
              du -s -B1 "$RUNNER_TEMP/terraform-plugin-cache"
            else
              echo "Provider cache not created."
            fi
          fi
