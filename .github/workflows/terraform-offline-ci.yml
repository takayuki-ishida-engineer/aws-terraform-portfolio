        run: |
          set -euo pipefail
          umask 077
          # Fake terraform, synthetic public.json and the pinned Helm installed above only:
          # no cluster, no kubectl and no AWS API. The input builder is refused in CI; the
          # plan may start no process but the pinned Helm, and a source mutation removing
