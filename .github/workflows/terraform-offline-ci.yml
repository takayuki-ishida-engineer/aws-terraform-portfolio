          # and is refused in CI; apply and destroy do not exist.
          export K8S_RUNTIME_HELM="$RUNNER_TEMP/v5-tools/helm"
          python3 - <<'PYRUNTIMEPLAN'
          import sys, unittest
          sys.path.insert(0, "scripts/local-workflow")
          import test_k8s_runtime
          result = unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.loadTestsFromModule(test_k8s_runtime))
          if not result.wasSuccessful() or result.skipped or result.testsRun != 29 or len(test_k8s_runtime.MUTATIONS) != 39:
              raise SystemExit("Kubernetes runtime input/plan tests failed, skipped or changed the reviewed counts.")
          print("Kubernetes runtime input/plan tests passed:", result.testsRun, "- guard mutations detected:", len(test_k8s_runtime.MUTATIONS))
          import test_k8s_runtime_status
          status_result = unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.loadTestsFromModule(test_k8s_runtime_status))
          if not status_result.wasSuccessful() or status_result.skipped or status_result.testsRun != 21 or len(test_k8s_runtime_status.MUTATIONS) != 32:
              raise SystemExit("Kubernetes runtime status tests failed, skipped or changed the reviewed counts.")
          print("Kubernetes runtime status tests passed (fake kubectl only):", status_result.testsRun, "- guard mutations detected:", len(test_k8s_runtime_status.MUTATIONS))
          PYRUNTIMEPLAN
          python3 scripts/local-workflow/k8s_runtime.py plan --input kubernetes/tests/fixtures/runtime.json --helm "$K8S_RUNTIME_HELM" --fixture --format json > "$RUNNER_TEMP/runtime-plan.json"
          python3 - <<'PYPLANREPORT'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "runtime-plan.json").read_text())
          stages = [(s["name"], s["count"]) for s in report["stages"]]
          expected = [("namespaces", 2), ("base", 16), ("controller", 13), ("istiod", 12), ("gateway", 5), ("mesh_security", 5), ("admission", 4), ("binding_writer", 3), ("ingress", 2)]
          if report.get("status") != "planned" or report.get("executed") is not False or report.get("kubernetes_api_calls") != 0 or report.get("aws_api_calls") != 0 \
                  or report.get("resource_count") != 62 or stages != expected or report["stages"][-1]["execution"] != "BLOCKED (binding-writer method not approved)" \
                  or report.get("not_implemented") != ["apply", "destroy"]:
              raise SystemExit("Kubernetes runtime offline plan evidence changed; independent review required.")
          print("Kubernetes runtime offline plan (fixture, nothing executed):", stages)
          PYPLANREPORT
          if python3 scripts/local-workflow/k8s_runtime_input.py --project acme --account-id 444455556666 --material /nonexistent --selections /nonexistent --out-dir /nonexistent --terraform /nonexistent; then
            echo "k8s_runtime_input.py must be refused in CI" >&2
            exit 1
