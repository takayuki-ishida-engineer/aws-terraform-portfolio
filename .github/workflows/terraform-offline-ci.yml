name: Terraform offline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Runs never cancel each other (Owner, 2026-11-18): one run of this workflow at a
# time, pull requests and main pushes alike; a later run waits until the earlier
# one finishes. GitHub still replaces an older *pending* run in the same group, so
# the next push or merge waits until the previous run has finished successfully.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  offline-validation:
    name: Credential-free Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CHECKPOINT_DISABLE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - name: Prepare job-local provider cache and disk measurements
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-plugin-cache"
          cat > "$RUNNER_TEMP/provider-storage.py" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          checkpoint = sys.argv[1]
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          cache = pathlib.Path(os.environ.get("TF_PLUGIN_CACHE_DIR", str(temporary / "terraform-plugin-cache")))
          print(f"Provider storage checkpoint: {checkpoint}", flush=True)

          def command(arguments):
              output = subprocess.check_output(arguments, text=True)
              print(output, end="", flush=True)
              return output

          command(["df", "-h", "/"])
          filesystem = command(["df", "-B1", "/"])
          available = int(filesystem.splitlines()[-1].split()[3])
          cache_bytes = None
          if cache.is_dir():
              command(["du", "-sh", str(cache)])
              cache_bytes = int(command(["du", "-s", "-B1", str(cache)]).split()[0])
          else:
              print("Provider cache not created; no cache usage available.", flush=True)

          package = pathlib.Path("registry.terraform.io/hashicorp/aws/6.72.0/linux_amd64")
          binaries = list((cache / package).glob("terraform-provider-aws_v6.72.0*"))
          cache_binary = binaries[0] if len(binaries) == 1 else None
          rows = []
          for root, directories, _files in os.walk(workspace):
              providers = pathlib.Path(root) / ".terraform/providers"
              directories[:] = [name for name in directories if name not in {".git", ".terraform"}]
              if not providers.is_dir():
                  continue
              print("Module provider directory:", providers, flush=True)
              command(["du", "-sh", str(providers)])
              local_bytes = int(command(["du", "-s", "-B1", str(providers)]).split()[0])
              command(["find", str(providers), "-type", "l", "-printf", "%p -> %l\n"])
              installed = list((providers / package).glob("terraform-provider-aws_v6.72.0*"))
              row = {"module": str(pathlib.Path(root).relative_to(workspace)),
                     "providers": str(providers), "local_allocated_bytes_no_follow": local_bytes,
                     "initialized": len(installed) == 1, "shares_cache_binary": False}
              if row["initialized"]:
                  binary = installed[0]
                  stat = binary.stat()
                  shared = cache_binary is not None and binary.samefile(cache_binary)
                  symlink = any(path.is_symlink() for path in (binary, *binary.parents)
                                if path == providers or providers in path.parents)
                  row.update({"shares_cache_binary": shared,
                              "link_kind": "symlink" if symlink else "hardlink" if shared else "independent copy",
                              "resolved_binary": str(binary.resolve()),
                              "referenced_logical_bytes": stat.st_size,
                              "referenced_allocated_bytes": stat.st_blocks * 512,
                              "device": stat.st_dev, "inode": stat.st_ino})
              rows.append(row)

          # One non-following du invocation deduplicates hardlinks across operands.
          operands = ([str(cache)] if cache.is_dir() else []) + [row["providers"] for row in rows]
          deduplicated = {}
          if operands:
              output = command(["du", "-s", "-B1", "--", *operands])
              deduplicated = {path: int(size) for size, path in
                              (line.split("\t", 1) for line in output.splitlines())}
          for row in rows:
              row["deduplicated_allocated_bytes"] = deduplicated.get(row["providers"], 0)
          initialized = [row for row in rows if row["initialized"]]
          references = sum(row["shares_cache_binary"] for row in initialized)
          identities = {(row["device"], row["inode"]) for row in initialized}
          stat = cache_binary.stat() if cache_binary is not None else None
          report = {"checkpoint": checkpoint, "available_bytes": available,
                    "cache_allocated_bytes": cache_bytes, "modules": rows,
                    "initialized_modules": len(initialized), "confirmed_cache_references": references,
                    "unique_referenced_binaries": len(identities),
                    "combined_allocated_bytes_no_follow": sum(deduplicated.values()),
                    "module_allocated_bytes_deduplicated": sum(row["deduplicated_allocated_bytes"] for row in rows),
                    "logical_bytes_across_references": sum(row.get("referenced_logical_bytes", 0) for row in rows),
                    "cache_binary_logical_bytes": stat.st_size if stat else None,
                    "cache_binary_allocated_bytes": stat.st_blocks * 512 if stat else None,
                    "estimated_avoided_binary_bytes": (references - 1) * stat.st_blocks * 512 if stat and references else None}
          # Referenced logical sizes are not local disk usage; estimates assume independent copies.
          with (temporary / "provider-storage.jsonl").open("a") as output:
              output.write(json.dumps(report) + "\n")
          print("Provider storage summary:", json.dumps({key: value for key, value in report.items() if key != "modules"}), flush=True)
          for row in rows:
              print("Provider reference:", json.dumps(row), flush=True)

          if checkpoint == "after_modules":
              expected = {"infra/services/dev/ca-central-1/serverless-api",
                      "infra/services/dev/ca-central-1/network",
                      "infra/services/dev/ca-central-1/platform", "infra/services/dev/ca-central-1/api",
                      "infra/services/dev/ca-central-1/tfstate", "infra/services/dev/ca-central-1/developer-access",
                      "infra/services/dev/ca-central-1/registry"} | {
                  "infra/modules/" + name for name in (
                      "vpc", "secrets_manager", "iam_account_policies", "iam_access", "lambda_workload",
                      "cloudwatch_logs", "s3_artifact_bucket", "api_gateway_http", "eks_platform", "private_ingress", "cognito_auth", "api_gateway_rest",
                      "tfstate_bucket", "developer_access", "ecr_repository")}
              if {row["module"] for row in initialized} != expected or references != len(expected) or len(identities) != 1:
                  raise SystemExit("Expected twenty-two initialized configurations reusing one locked AWS 6.72.0 binary; inspect measurements.")
          if checkpoint == "job_completion":
              snapshots = [json.loads(line) for line in (temporary / "provider-storage.jsonl").read_text().splitlines()]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\n## Provider storage measurements\n\n| Checkpoint | Available bytes | Cache allocated bytes | Cache references |\n| --- | ---: | ---: | ---: |\n")
                  for item in snapshots:
                      summary.write(f"| {item['checkpoint']} | {item['available_bytes']} | {item['cache_allocated_bytes']} | {item['confirmed_cache_references']} |\n")
                  summary.write("\nPhysical du measurements do not follow symlinks and the combined invocation deduplicates hardlinks. Resolved binary sizes are reference metadata; avoided duplicate bytes are an estimate assuming independent copies, not a runner free-space saving.\n")
          PY
          python3 "$RUNNER_TEMP/provider-storage.py" before_cleanup

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space using the approved cleanup allowlist
        id: disk_cleanup
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /
          cleanup_before_bytes=$(df -B1 --output=avail / | tail -n 1)

          readonly -a cleanup_paths=(
            /usr/share/dotnet
            /usr/local/lib/android
            /opt/ghc
            /usr/local/.ghcup
            /opt/hostedtoolcache/CodeQL
            /usr/share/swift
            /usr/local/go
            /opt/hostedtoolcache/go
            /usr/lib/jvm
            /opt/hostedtoolcache/Ruby
            /home/runner/.rvm
          )
          for path in "${cleanup_paths[@]}"; do
            if [[ -e "$path" || -L "$path" ]]; then
              sudo du -sh -- "$path"
              sudo rm -rf -- "$path"
            else
              printf 'Skipping missing path: %s\n' "$path"
            fi
          done

          echo "Disk usage after cleanup:"
          df -h /
          cleanup_after_bytes=$(df -B1 --output=avail / | tail -n 1)
          cleanup_freed_bytes=$((cleanup_after_bytes - cleanup_before_bytes))
          printf 'Disk space freed: %s bytes\n' "$cleanup_freed_bytes"
          git --version
          python3 --version
          node --version

          {
            printf 'before_available_bytes=%s\n' "$cleanup_before_bytes"
            printf 'after_available_bytes=%s\n' "$cleanup_after_bytes"
            printf 'freed_bytes=%s\n' "$cleanup_freed_bytes"
          } >> "$GITHUB_OUTPUT"
          {
            printf '## Runner disk cleanup\n\n'
            printf 'Root filesystem available-space increase: %s bytes.\n' "$cleanup_freed_bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure disk usage after runner cleanup
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/provider-storage.py" after_cleanup

      - name: Install Terraform
        id: terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check repository formatting
        id: format
        run: |
          set -euo pipefail
          terraform version
          terraform fmt -check -recursive

      - name: Check that local-only configuration files are not tracked
        id: hygiene
        run: |
          set -euo pipefail
          python3 scripts/repository-hygiene/check_tracked_files.py --self-test
          python3 scripts/repository-hygiene/check_tracked_files.py

      - name: Validate development root with its committed lock
        id: dev
        working-directory: infra/services/dev/ca-central-1/serverless-api
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false -no-color -lockfile=readonly
          terraform validate -no-color
          git diff --exit-code -- .terraform.lock.hcl

      - name: Measure provider storage after the first initialization
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/provider-storage.py" after_first_init

      - name: Verify development serverless API root integration
        id: root_integration
        working-directory: infra/services/dev/ca-central-1/serverless-api
        run: |
          set -euo pipefail
          umask 077
          # Reuse the root initialization, committed lock and job-local provider cache.
          python3 tests/check_required_inputs.py --terraform terraform
          if terraform test -no-color -json -verbose > "$RUNNER_TEMP/root-integration-tests.jsonl"; then
            test_status=0
          else
            test_status=$?
          fi
          python3 tests/check_root_integration.py \
            --test-events "$RUNNER_TEMP/root-integration-tests.jsonl" \
            --terraform-exit-code "$test_status" \
            --self-test > "$RUNNER_TEMP/root-integration-static.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          report = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "root-integration-static.json").read_text())
          if report.get("status") != "passed" or report.get("aws_api_calls") != 0:
            raise SystemExit("Root integration actual-plan verification failed.")
          print("Actual development root integration verification:", report)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"passed={report['native_tests']}\n")
          PY

      - name: Validate DEV network root and actual routing contracts
        id: network
        working-directory: infra/services/dev/ca-central-1/network
        run: |
          set -euo pipefail
          umask 077
          terraform init -backend=false -input=false -no-color -lockfile=readonly
          terraform validate -no-color
          git diff --exit-code -- .terraform.lock.hcl
          python3 tests/check_required_inputs.py --terraform terraform > "$RUNNER_TEMP/network-required-inputs.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "network-required-inputs.json").read_text())
          if report.get("status") != "passed" or report.get("aws_api_calls") != 0 or report.get("required_input_rejections") != 7 or report.get("security_input_rejections") != 7:
              raise SystemExit("DEV network required-input rejection evidence failed.")
          print("DEV network required-input rejections:", report)
          PY
          checker="$GITHUB_WORKSPACE/infra/modules/vpc/tests/check_network_configuration.py"
          # Stream away only repeated provider schemas; preserve full resource/diagnostic evidence.
          if terraform test -no-color -json -verbose | python3 "$checker" --compact > "$RUNNER_TEMP/network-tests.jsonl"; then
            test_status=0
          else
            test_status=$?
          fi
          python3 "$checker" --scope root \
            --test-events "$RUNNER_TEMP/network-tests.jsonl" \
            --terraform-exit-code "$test_status" --self-test > "$RUNNER_TEMP/network-verification.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "network-verification.json").read_text())
          expected = {'native_tests': 15, 'positive_plans': 6, 'negative_cases': 9, 'semantic_mutations': 84, 'capture_failure_injections': 22, 'source_dependency_mutations': 14, 'policy_structure_mutations': 33}
          if report.get("status") != "passed" or report.get("evidence_type") != "actual_mock_plan_verification" or report.get("aws_api_calls") != 0 or any(report.get(key) != value for key, value in expected.items()):
              raise SystemExit("Validate DEV network root and actual routing contracts evidence/count contract changed; independent review required.")
          print("Actual network verification:", report)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"passed={report['native_tests']}\n")
          PY

      - name: Verify EKS root actual plans and security contracts
        id: platform
        working-directory: infra/services/dev/ca-central-1/platform
        run: |
          set -euo pipefail
          umask 077
          terraform init -backend=false -input=false -no-color -lockfile=readonly
          terraform validate -no-color
          git diff --exit-code -- .terraform.lock.hcl
          python3 tests/check_required_inputs.py --terraform terraform > "$RUNNER_TEMP/platform-required.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "platform-required.json").read_text())
          if report.get("status") != "passed" or report.get("aws_api_calls") != 0 or report.get("required_input_rejections") != 14 or report.get("network_field_rejections") != 11:
              raise SystemExit("EKS platform required-input/network reference rejection evidence failed.")
          print("Actual rejected platform inputs:", report)
          PY
          checker="$GITHUB_WORKSPACE/infra/modules/eks_platform/tests/check_platform_configuration.py"
          if terraform test -no-color -json -verbose | python3 "$checker" --compact > "$RUNNER_TEMP/platform-tests.jsonl"; then
            test_status=0
          else
            test_status=$?
          fi
          python3 "$checker" --scope root \
            --test-events "$RUNNER_TEMP/platform-tests.jsonl" \
            --terraform-exit-code "$test_status" --self-test > "$RUNNER_TEMP/platform-verification.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "platform-verification.json").read_text())
          expected = {'native_tests': 40, 'positive_plans': 7, 'negative_cases': 33, 'semantic_mutations': 79, 'capture_failure_injections': 21, 'source_dependency_mutations': 10}
          if report.get("status") != "passed" or report.get("aws_api_calls") != 0 or report.get("evidence_type") != "actual_mock_plan_verification" or any(report.get(k) != v for k, v in expected.items()):
              raise SystemExit("EKS root actual-plan/security/count contract failed; independent review required.")
          print("Actual EKS root verification:", report)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"passed={report['native_tests']}\n")
          PY

          python3 "$GITHUB_WORKSPACE/infra/modules/private_ingress/tests/check_ingress.py" --scope root \
            --events "$RUNNER_TEMP/platform-tests.jsonl" --exit-code "$test_status" --self-test > "$RUNNER_TEMP/ingress-root.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ["RUNNER_TEMP"],"ingress-root.json").read_text())
          expected={"native_tests":40,"positive_plans":7,"negative_cases":33,"semantic_mutations":63,"capture_failure_injections":21,"source_dependency_mutations":8,"iam_policy_mutations":12}
          if report.get("status")!="passed" or report.get("aws_api_calls")!=0 or any(report.get(k)!=v for k,v in expected.items()):
              raise SystemExit("Independent platform ingress security/evidence checks failed")
          print("Independent actual Root ingress verification:",report)
          PYCODE

      - name: Verify EKS child actual plans and security contracts
        id: eks_platform
        working-directory: infra/modules/eks_platform
        run: |
          set -euo pipefail
          umask 077
          cp "$GITHUB_WORKSPACE/infra/services/dev/ca-central-1/platform/.terraform.lock.hcl" .terraform.lock.hcl
          terraform init -backend=false -input=false -no-color -lockfile=readonly
          terraform validate -no-color
          checker="$GITHUB_WORKSPACE/infra/modules/eks_platform/tests/check_platform_configuration.py"
          if terraform test -no-color -json -verbose | python3 "$checker" --compact > "$RUNNER_TEMP/eks_platform-tests.jsonl"; then
            test_status=0
          else
            test_status=$?
          fi
          python3 "$checker" --scope child \
            --test-events "$RUNNER_TEMP/eks_platform-tests.jsonl" \
            --terraform-exit-code "$test_status" --self-test > "$RUNNER_TEMP/eks_platform-verification.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "eks_platform-verification.json").read_text())
          expected = {'native_tests': 55, 'positive_plans': 8, 'negative_cases': 47, 'semantic_mutations': 79, 'capture_failure_injections': 21, 'source_dependency_mutations': 10}
          if report.get("status") != "passed" or report.get("aws_api_calls") != 0 or report.get("evidence_type") != "actual_mock_plan_verification" or any(report.get(k) != v for k, v in expected.items()):
              raise SystemExit("EKS child actual-plan/security/count contract failed; independent review required.")
          print("Actual EKS child verification:", report)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"passed={report['native_tests']}\n")
          PY
          python3 tests/check_native_source_mutations.py --terraform terraform > "$RUNNER_TEMP/eks-source-mutations.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "eks-source-mutations.json").read_text())
          if report.get("status") != "passed" or report.get("aws_api_calls") != 0 or report.get("native_source_mutations") != 10:
              raise SystemExit("Actual unsafe EKS Terraform source mutation evidence failed.")
          print("Actual unsafe Terraform source re-plans rejected:", report)
          PY

      - name: Verify private ingress actual plans and source mutations
        id: private_ingress
        working-directory: infra/modules/private_ingress
        run: |
          set -euo pipefail
          umask 077
          cp "$GITHUB_WORKSPACE/infra/services/dev/ca-central-1/platform/.terraform.lock.hcl" .terraform.lock.hcl
          terraform init -backend=false -input=false -lockfile=readonly -no-color
          terraform validate -no-color
          compact="$GITHUB_WORKSPACE/infra/modules/eks_platform/tests/check_platform_configuration.py"
          if terraform test -json -verbose -no-color | python3 "$compact" --compact > "$RUNNER_TEMP/ingress-tests.jsonl"; then
            test_status=0
          else
            test_status=$?
          fi
          python3 tests/check_ingress.py --scope child --events "$RUNNER_TEMP/ingress-tests.jsonl" --exit-code "$test_status" --self-test > "$RUNNER_TEMP/ingress-child.json"
          python3 tests/check_source_mutations.py --terraform terraform > "$RUNNER_TEMP/ingress-source.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          report=json.loads((temp/"ingress-child.json").read_text())
          expected={"native_tests":36,"positive_plans":7,"negative_cases":29,"semantic_mutations":63,"capture_failure_injections":21,"source_dependency_mutations":8,"iam_policy_mutations":12}
          if report.get("status")!="passed" or report.get("aws_api_calls")!=0 or any(report.get(k)!=v for k,v in expected.items()):
              raise SystemExit("Ingress child actual-plan security/evidence checks failed")
          source=json.loads((temp/"ingress-source.json").read_text())
          if source.get("status")!="passed" or source.get("aws_api_calls")!=0 or source.get("actual_source_mutations")!=12:
              raise SystemExit("Actual unsafe ingress Terraform re-plans were not completely detected")
          print("Actual ingress verification:",report,source)
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write(f"passed={report['native_tests']}\n")
          PYCODE

      - name: Validate VPC legacy and extension actual mock plans
        id: vpc
        working-directory: infra/modules/vpc
        run: |
          set -euo pipefail
          umask 077
          # Transient child lock, exact reviewed provider identity.
          cp "$GITHUB_WORKSPACE/infra/services/dev/ca-central-1/serverless-api/.terraform.lock.hcl" .terraform.lock.hcl
          terraform init -backend=false -input=false -no-color -lockfile=readonly
          terraform validate -no-color
          checker="$GITHUB_WORKSPACE/infra/modules/vpc/tests/check_network_configuration.py"
          # Stream away only repeated provider schemas; preserve full resource/diagnostic evidence.
          if terraform test -no-color -json -verbose | python3 "$checker" --compact > "$RUNNER_TEMP/vpc-tests.jsonl"; then
            test_status=0
          else
            test_status=$?
          fi
          python3 "$checker" --scope child \
            --test-events "$RUNNER_TEMP/vpc-tests.jsonl" \
            --terraform-exit-code "$test_status" --self-test > "$RUNNER_TEMP/vpc-verification.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "vpc-verification.json").read_text())
          expected = {'native_tests': 84, 'positive_plans': 18, 'negative_cases': 66, 'semantic_mutations': 45, 'capture_failure_injections': 22, 'source_dependency_mutations': 14, 'policy_structure_mutations': 33}
          if report.get("status") != "passed" or report.get("evidence_type") != "actual_mock_plan_verification" or report.get("aws_api_calls") != 0 or any(report.get(key) != value for key, value in expected.items()):
              raise SystemExit("Validate VPC legacy and extension actual mock plans evidence/count contract changed; independent review required.")
          print("Actual vpc verification:", report)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"passed={report['native_tests']}\n")
          PY

      - name: Validate Secrets Manager module and mock inventory
        id: secrets
        working-directory: infra/modules/secrets_manager
        run: |
          set -euo pipefail
          umask 077
          cp "$GITHUB_WORKSPACE/infra/services/dev/ca-central-1/serverless-api/.terraform.lock.hcl" .terraform.lock.hcl
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
          if terraform test -no-color -json -verbose > "$RUNNER_TEMP/secrets-tests.jsonl"; then
            test_status=0
          else
            test_status=$?
          fi
