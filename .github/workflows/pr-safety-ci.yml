          PYTHONDONTWRITEBYTECODE=1 python3 tests/check_root.py --test-events "$RUNNER_TEMP/registry-root-tests.jsonl" \
            --terraform-exit-code "$root_status" --terraform terraform --self-test > "$RUNNER_TEMP/registry-root.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          module = json.loads((temp / "registry-module.json").read_text())
          root = json.loads((temp / "registry-root.json").read_text())
          import sys; sys.path.insert(0, os.environ["GITHUB_WORKSPACE"] + "/scripts/ci"); from expected_counts import load
          expected_module = load("registry_module")
          expected_root = {**load("registry_root"), "image_lock_purposes": ["istio-pilot", "istio-proxy", "lbc"]}
          for report, expected in ((module, expected_module), (root, expected_root)):
              if report.get("status") != "passed" or report.get("evidence_type") != "actual_mock_plan_verification" or report.get("aws_api_calls") != 0 \
                  or any(report.get(key) != value for key, value in expected.items()):
                  raise SystemExit("DEV registry module/root evidence or counts changed; independent review required.")
          print("Actual ecr_repository verification:", module)
          print("Actual registry root verification:", root)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"passed={module['native_tests'] + root['native_tests']}\n")
          PY

      - name: Verify developer access module and root
        if: ${{ contains(fromJSON(steps.impact.outputs.selected), 'developer_access') }}
        id: developer_access
        run: |
          set -euo pipefail
          umask 077
          checker="$GITHUB_WORKSPACE/infra/modules/eks_platform/tests/check_platform_configuration.py"
          root="$GITHUB_WORKSPACE/infra/services/dev/ca-central-1/developer-access"
          cd "$GITHUB_WORKSPACE/infra/modules/developer_access"
          cp "$root/.terraform.lock.hcl" .terraform.lock.hcl
          terraform init -backend=false -input=false -no-color -lockfile=readonly
          terraform validate -no-color
          # Stream away only repeated provider schemas; preserve full resource/diagnostic evidence.
          if terraform test -no-color -json -verbose | python3 "$checker" --compact > "$RUNNER_TEMP/developer-access-module-tests.jsonl"; then
            module_status=0
          else
            module_status=$?
          fi
          python3 tests/check_developer_access.py --test-events "$RUNNER_TEMP/developer-access-module-tests.jsonl" \
            --terraform-exit-code "$module_status" --self-test > "$RUNNER_TEMP/developer-access-module.json"
          cd "$root"
          terraform init -backend=false -input=false -no-color -lockfile=readonly
          terraform validate -no-color
          git diff --exit-code -- .terraform.lock.hcl
          if terraform test -no-color -json -verbose | python3 "$checker" --compact > "$RUNNER_TEMP/developer-access-root-tests.jsonl"; then
            root_status=0
          else
            root_status=$?
          fi
          python3 tests/check_root.py --test-events "$RUNNER_TEMP/developer-access-root-tests.jsonl" \
            --terraform-exit-code "$root_status" --terraform terraform --self-test > "$RUNNER_TEMP/developer-access-root.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          module = json.loads((temp / "developer-access-module.json").read_text())
          root = json.loads((temp / "developer-access-root.json").read_text())
          import sys; sys.path.insert(0, os.environ["GITHUB_WORKSPACE"] + "/scripts/ci"); from expected_counts import load
          expected_module = load("developer_access_module")
          expected_root = load("developer_access_root")
          for report, expected in ((module, expected_module), (root, expected_root)):
              if report.get("status") != "passed" or report.get("evidence_type") != "actual_mock_plan_verification" or report.get("aws_api_calls") != 0 \
                  or any(report.get(key) != value for key, value in expected.items()):
                  raise SystemExit("Developer access module/root evidence or counts changed; independent review required.")
          print("Actual developer_access verification:", module)
          print("Actual developer-access root verification:", root)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"passed={module['native_tests'] + root['native_tests']}\n")
          PY

      - name: Validate committed DEV values and the local workflow preflight
        if: ${{ contains(fromJSON(steps.impact.outputs.selected), 'committed_values') }}
        id: committed_values
        run: |
          set -euo pipefail
          umask 077
          # Offline only: fake terraform/aws self-tests, then mock plans of every DEV
          # root with its committed values, the offline preflight and the S3 backend
          # examples in temporary copies. The live preflight is never run in CI.
          python3 scripts/local-workflow/test_local_workflow.py
          python3 scripts/local-workflow/check_committed_values.py --terraform terraform > "$RUNNER_TEMP/committed-values.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "committed-values.json").read_text())
          roots = {item["root"]: item for item in report.get("roots", [])}
          if report.get("status") != "passed" or report.get("aws_api_calls") != 0 or sorted(roots) != ["api", "developer-access", "network", "platform", "registry", "serverless-api", "tfstate"] \
              or any(item.get("mock_plan") != "pass" or item.get("synthetic_local_values") != "passed" or item.get("local_override_effective") is not True for item in roots.values()) \
              or any(roots[name].get("backend_examples") != "valid" for name in ("api", "developer-access", "network", "platform", "registry", "serverless-api")) \
              or roots["tfstate"].get("backend_examples") != "none (bootstrap root stays local)":
              raise SystemExit("Committed DEV values or local workflow preflight evidence failed.")
          print("Committed DEV values and preflight:", json.dumps(roots, sort_keys=True))
          PY
          git status --porcelain --ignored -- infra/services/dev/ca-central-1 | { ! grep -E 'committed|no-tfvars|local\.auto\.tfvars$|\.tfplan|backend_override\.tf$|\.tfbackend$'; }

      - name: Test and export the offline AWS validation toolkit
        if: ${{ contains(fromJSON(steps.impact.outputs.selected), 'toolkit') }}
        id: toolkit
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTEST'
          import os
          import sys
          import unittest

          sys.path.insert(0, "scripts/ci")
          from expected_counts import load
          suite = unittest.defaultTestLoader.discover("scripts/aws-policy-validation/tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.expectedFailures or result.testsRun != load("toolkit")["tests"]:
            raise SystemExit("Toolkit offline self-tests failed, changed the reviewed count or skipped.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"passed={result.testsRun}\n")
          PYTEST
          python3 scripts/aws-policy-validation/policy_validation.py export \
            --iam-test-events "$RUNNER_TEMP/iam-tests.jsonl" \
            --account-test-events "$RUNNER_TEMP/account-policies-tests.jsonl" \
            --output-dir "$RUNNER_TEMP/policy-validation-bundle"
          python3 scripts/aws-policy-validation/policy_validation.py offline-check \
            --bundle "$RUNNER_TEMP/policy-validation-bundle"
          # Default run is offline; never pass the authenticated-execution flag here.
          python3 scripts/aws-policy-validation/policy_validation.py run \
            --bundle "$RUNNER_TEMP/policy-validation-bundle" \
            --output-dir "$RUNNER_TEMP/policy-validation-results"

      - name: Offline unit negative and mutation contracts only
        if: ${{ contains(fromJSON(steps.impact.outputs.selected), 'emulator_contracts_unit') }}
        id: emulator_contracts_unit
        run: python3 scripts/emulator-verification/tests/test_verification.py

      - name: Step 2 rehearsal gate tests (offline; never starts the emulator)
        if: ${{ contains(fromJSON(steps.impact.outputs.selected), 'emulator_contracts_rehearsal') }}
        id: emulator_contracts_rehearsal
        run: python3 scripts/emulator-rehearsal/test_rehearse.py

      - name: Evidence ledger tests (offline negative, mutation and tamper)
        if: ${{ contains(fromJSON(steps.impact.outputs.selected), 'emulator_contracts_ledger_tests') }}
        id: emulator_contracts_ledger_tests
        run: python3 scripts/emulator-evidence/test_harvest.py

      - name: Evidence ledger check (schema, safety, index, reconciliation)
        if: ${{ contains(fromJSON(steps.impact.outputs.selected), 'emulator_contracts_ledger_check') }}
        id: emulator_contracts_ledger_check
        run: python3 scripts/emulator-evidence/harvest.py check docs/evidence/emulator-runs

      - name: Record final provider and disk usage even after failure
        id: storage_final
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/provider-storage.py" ]]; then
            python3 "$RUNNER_TEMP/provider-storage.py" job_completion
          else
            echo "Measurement helper unavailable after an earlier failure."
            df -h /
            df -B1 /
            if [[ -d "$RUNNER_TEMP/terraform-plugin-cache" ]]; then
              du -sh "$RUNNER_TEMP/terraform-plugin-cache"
              du -s -B1 "$RUNNER_TEMP/terraform-plugin-cache"
            else
              echo "Provider cache not created."
            fi
          fi

      - name: Verify that exactly the selected and always-on steps ran and passed
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          python3 scripts/ci/impact.py verify --report "$RUNNER_TEMP/pr-safety-impact.json"
