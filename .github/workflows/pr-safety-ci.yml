      - name: Verify the Kubernetes runtime input builder, offline plan, read-only status, receipt safety foundation and fake apply engine (items 6c-A, 6c-B1, 6c-B3a, 6c-B3b-Apply-A)
        if: ${{ contains(fromJSON(steps.impact.outputs.selected), 'kubernetes_runtime_plan') }}
        id: kubernetes_runtime_plan
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          KUBECONFIG: /dev/null
        run: |
          set -euo pipefail
          umask 077
          # Fake terraform, synthetic public.json and the pinned Helm installed above only:
          # no cluster, no kubectl and no AWS API. The input builder is refused in CI; the
          # plan may start no process but the pinned Helm, and a source mutation removing
          # each guard must be detected. status reads only a fake kubectl's synthetic cluster here
          # and is refused in CI. The 6c-B3a receipt, journal and transport-contract tests use
          # temporary local stores and fakes only; apply and destroy are refused before any input is read.
          # The 6c-B3b-Apply-A engine runs only against an in-memory fake adapter and fake clock.
          export K8S_RUNTIME_HELM="$RUNNER_TEMP/v5-tools/helm"
          python3 - <<'PYRUNTIMEPLAN'
          import sys, unittest
          sys.path.insert(0, "scripts/local-workflow")
          sys.path.insert(0, "scripts/ci")
          from expected_counts import load
          import test_k8s_runtime
          result = unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.loadTestsFromModule(test_k8s_runtime))
          if not result.wasSuccessful() or result.skipped or result.testsRun != load("k8s_runtime_plan_tests")["tests"] or len(test_k8s_runtime.MUTATIONS) != load("k8s_runtime_plan_tests")["mutations"]:
              raise SystemExit("Kubernetes runtime input/plan tests failed, skipped or changed the reviewed counts.")
          print("Kubernetes runtime input/plan tests passed:", result.testsRun, "- guard mutations detected:", len(test_k8s_runtime.MUTATIONS))
          import test_k8s_runtime_status
          status_result = unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.loadTestsFromModule(test_k8s_runtime_status))
          if not status_result.wasSuccessful() or status_result.skipped or status_result.testsRun != load("k8s_runtime_status_tests")["tests"] or len(test_k8s_runtime_status.MUTATIONS) != load("k8s_runtime_status_tests")["mutations"]:
              raise SystemExit("Kubernetes runtime status tests failed, skipped or changed the reviewed counts.")
          print("Kubernetes runtime status tests passed (fake kubectl only):", status_result.testsRun, "- guard mutations detected:", len(test_k8s_runtime_status.MUTATIONS))
          PYRUNTIMEPLAN
          # CI-PERF-01B candidate: bounded, independent offline receipt/apply processes.
          # A passing candidate run does not authorize adoption or merge. The runner
          # relaunches its coordinator behind the same clean descriptor boundary.
          python3 scripts/ci/runtime_test_runner.py --workers auto | tee "$RUNNER_TEMP/runtime-runner.jsonl"
          python3 - "$RUNNER_TEMP/runtime-runner.jsonl" <<'PYRUNTIMECOUNTS'
          import sys
          sys.path.insert(0, "scripts/ci")
          from expected_counts import load
          from runtime_test_runner import read_evidence
          # Keep executable load calls in the Step: impact.py binds these suites to it.
          suites = read_evidence(sys.argv[1], receipt_expected=load("k8s_runtime_receipt_tests"),
                                 apply_expected=load("k8s_runtime_apply_tests"))
          print("Kubernetes runtime receipt/apply reviewed counts and evidence verified:",
                [(suite["suite"], suite["testsRun"], len(suite["mutation_definitions"])) for suite in suites])
          PYRUNTIMECOUNTS
          python3 scripts/local-workflow/k8s_runtime.py plan --input kubernetes/tests/fixtures/runtime.json --helm "$K8S_RUNTIME_HELM" --fixture --format json > "$RUNNER_TEMP/runtime-plan.json"
          python3 - <<'PYPLANREPORT'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "runtime-plan.json").read_text())
          stages = [(s["name"], s["count"]) for s in report["stages"]]
          expected = [("namespaces", 2), ("base", 16), ("controller", 13), ("istiod", 12), ("gateway", 5), ("mesh_security", 5), ("admission", 4), ("binding_writer", 3), ("ingress", 2)]
          if report.get("status") != "planned" or report.get("executed") is not False or report.get("kubernetes_api_calls") != 0 or report.get("aws_api_calls") != 0 \
                  or report.get("resource_count") != 62 or stages != expected or report["stages"][-1]["execution"] != "BLOCKED (binding-writer method not approved)" \
                  or report.get("not_implemented") != ["apply", "destroy"]:
              raise SystemExit("Kubernetes runtime offline plan evidence changed; independent review required.")
          print("Kubernetes runtime offline plan (fixture, nothing executed):", stages)
          PYPLANREPORT
          if python3 scripts/local-workflow/k8s_runtime_input.py --project acme --account-id 444455556666 --material /nonexistent --selections /nonexistent --out-dir /nonexistent --terraform /nonexistent; then
            echo "k8s_runtime_input.py must be refused in CI" >&2
            exit 1
          fi
          if python3 scripts/local-workflow/k8s_runtime.py status --input /nonexistent --helm /nonexistent --kubectl /nonexistent --terraform /nonexistent; then
            echo "k8s_runtime.py status must be refused in CI" >&2
            exit 1
          fi
          for operation in apply destroy; do
            set +e
            python3 scripts/local-workflow/k8s_runtime.py "$operation" --input /nonexistent 2> "$RUNNER_TEMP/refusal.txt"
            refused=$?
            set -e
            if [ "$refused" -ne 1 ] || ! grep -q "operation_not_approved:$operation" "$RUNNER_TEMP/refusal.txt"; then
              echo "k8s_runtime.py $operation must be refused (operation_not_approved)" >&2
              exit 1
            fi
          done
          if python3 scripts/local-workflow/k8s_runtime.py receipt verify --cluster --input /nonexistent --helm /nonexistent --receipt-dir /nonexistent --expect-manifest-sha256 0 --expect-input-sha256 0 --kubectl /nonexistent --terraform /nonexistent; then
            echo "k8s_runtime.py receipt verify must not succeed in CI" >&2
            exit 1
          fi

