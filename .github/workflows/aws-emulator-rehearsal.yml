name: AWS Emulator Step 2 rehearsal
# Owner-dispatched Step 2 rehearsal of the real network root (vpc module) in the
# official AWS Emulator under all fourteen controls. No AWS credentials, secrets,
# artifacts, caches or registry pushes. Results stay in this run's log and job
# summary and are recorded in docs/step2-emulator-rehearsals.md.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Reviewed merged main SHA (40 lowercase hex), must equal this workflow's main SHA
        required: true
        type: string
      scenario:
        description: Network root scenario (full stops at create on the known emulator security group gap)
        required: true
        type: choice
        options:
          - no-interface-endpoints
          - full
        default: no-interface-endpoints
      owner_billing_confirmed:
        description: Owner just verified merged main CI success, Public/Free/standard runner, all five $0 Budgets and usage blocking; uncertainty means do not run
        required: true
        type: boolean
        default: false
      owner_checked_at:
        description: RFC3339 timestamp with timezone of the Owner check, less than 30 minutes ago; create a fresh dispatch instead of rerunning
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aws-emulator-rehearsal
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      OWNER_CHECKED_AT: ${{ inputs.owner_checked_at }}
      OWNER: ${{ github.repository_owner }}
      VISIBILITY: ${{ github.event.repository.visibility }}
      TARGET_SHA: ${{ inputs.target_sha }}
      OWNER_BILLING_CONFIRMED: ${{ inputs.owner_billing_confirmed }}
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Require owner cost confirmation and reviewed main SHA
        id: consent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from datetime import datetime,timezone
          e=os.environ
          assert e['ACTOR']==e['OWNER'] and e['VISIBILITY']=='public'
          assert e['OWNER_BILLING_CONFIRMED']=='true' and e['TRIGGERING_ACTOR']==e['OWNER'] and e['GITHUB_RUN_ATTEMPT']=='1'
          stamp=datetime.fromisoformat(e['OWNER_CHECKED_AT'])
          assert stamp.tzinfo is not None and 0 <= (datetime.now(timezone.utc)-stamp).total_seconds() <= 1800
          assert e['GITHUB_REF']=='refs/heads/main' and re.fullmatch('[0-9a-f]{40}',e['TARGET_SHA'])
          assert e['TARGET_SHA']==e['GITHUB_SHA']
          assert e['SCENARIO'] in ('no-interface-endpoints','full')
          with open(e['GITHUB_OUTPUT'],'a') as out: out.write('accepted=true\n')
          PY
      - name: Checkout reviewed target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Prepare verified packages, provider mirror and image context
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: STEP2_BASE="$RUNNER_TEMP/step2" python3 scripts/emulator-rehearsal/prepare.py --docker-context
      - name: Build temporary image and run the isolated rehearsal
        id: execution
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/step2/context"
          container="step2-rehearsal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image_file="$RUNNER_TEMP/step2-image-id"
          cleanup() {
            result=$?
            set +e
            cleanup_failed=0
            if owned_container=$(docker container ls --all --filter "name=^/${container}$" --format '{{.Names}}'); then
              if test -n "$owned_container"; then
                if test "$owned_container" = "$container"; then docker rm -f "$container" >/dev/null || cleanup_failed=1; else cleanup_failed=1; fi
              fi
            else cleanup_failed=1; fi
            if test -f "$image_file"; then docker image rm "$(cat "$image_file")" >/dev/null || cleanup_failed=1; fi
            rm -rf -- "$RUNNER_TEMP/step2" "$image_file" || cleanup_failed=1
            if test "$cleanup_failed" != 0; then
              printf '%s\n' '{"gate":"host-cleanup","status":"FAIL","diagnostic":"HOST_CLEANUP_FAILED"}' | tee -a "$RUNNER_TEMP/step2-safe-report.jsonl"
              exit 1
            fi
            printf '%s\n' '{"gate":"host-cleanup","status":"PASS"}' | tee -a "$RUNNER_TEMP/step2-safe-report.jsonl"
            exit "$result"
          }
          trap cleanup EXIT
          docker build --platform linux/amd64 --iidfile "$image_file" --tag "$container" "$context" >/dev/null
          image="$(cat "$image_file")"
          docker run --rm --name "$container" --network none --cap-drop ALL --security-opt no-new-privileges:true --read-only --user 1000:1000 --memory 6g --memory-swap 6g --cpus 2 --pids-limit 512 --tmpfs /opt/step2-work:rw,exec,nosuid,nodev,size=3g,uid=1000,gid=1000,mode=0700 --tmpfs /opt/step2-evidence:rw,noexec,nosuid,nodev,size=1m,uid=1000,gid=1000,mode=0700 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000 "$image" | tee "$RUNNER_TEMP/step2-safe-report.jsonl"
      - name: Nonsecret summary
        env:
          EXECUTION_STATUS: ${{ steps.execution.outcome }}
          OWNER_ATTESTATION_ACCEPTED: ${{ steps.consent.outputs.accepted }}
        if: always()
        run: |
          if test -f scripts/emulator-rehearsal/summarize.py; then
            python3 scripts/emulator-rehearsal/summarize.py "$RUNNER_TEMP/step2-safe-report.jsonl"
          else
            printf '%s\n' 'BLOCKED: CHECKOUT_UNAVAILABLE; no rehearsal evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
